<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#f7f8fc"/>
  <rect x="42" y="36" width="996" height="88" rx="28" fill="#101b3a"/>
  <text x="78" y="92" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#ffffff">MARTECH IN PRACTICE</text>

  <text x="56" y="190" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" fill="#101b3a">B2B SEO is becoming</text>
  <text x="56" y="260" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="700" fill="#6842c7">a branded-search game.</text>
  <text x="58" y="316" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#1d2744">I think 90%+ branded traffic is closer than most teams expect.</text>

  <rect x="56" y="360" width="968" height="148" rx="26" fill="#ffffff" stroke="#d9dced" stroke-width="2"/>
  <text x="82" y="404" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#101b3a">WHY IS THIS HAPPENING?</text>
  <text x="82" y="447" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#1d2744">SERP changes  •  AI answers  •  Ads  •  Video  •  Forums</text>
  <text x="82" y="481" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#1d2744">More discovery can happen without a traditional organic click.</text>

  <rect x="56" y="536" width="968" height="154" rx="26" fill="#eee8fb"/>
  <text x="82" y="582" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#6842c7">ZERO-CLICK CHANGES THE FUNNEL</text>
  <text x="82" y="628" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#1d2744">AI answers + SERPs + video + forums can influence buyer perception.</text>
  <text x="82" y="664" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#1d2744">The buyer may search your brand later, when intent is much higher.</text>

  <rect x="56" y="724" width="468" height="380" rx="28" fill="#edf3fb"/>
  <text x="84" y="775" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#101b3a">OLD SEO FOCUS</text>
  <rect x="84" y="810" width="410" height="58" rx="16" fill="#dcebf9"/>
  <text x="104" y="848" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#101b3a">Non-branded traffic</text>
  <text x="90" y="905" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#1d2744">• More blog content</text>
  <text x="90" y="950" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#1d2744">• Informational clicks</text>
  <text x="90" y="995" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#1d2744">• Lead volume</text>
  <text x="90" y="1040" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#1d2744">• Traffic as the main KPI</text>

  <rect x="556" y="724" width="468" height="380" rx="28" fill="#e7f8f3"/>
  <text x="584" y="775" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#0aa88f">WHAT I WOULD OPTIMISE</text>
  <rect x="584" y="810" width="410" height="58" rx="16" fill="#cbeee5"/>
  <text x="604" y="848" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#101b3a">Branded demand</text>
  <text x="590" y="905" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#1d2744">• Buyer discovery</text>
  <text x="590" y="950" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#1d2744">• Branded search</text>
  <text x="590" y="995" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#1d2744">• High-intent pages</text>
  <text x="590" y="1040" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#1d2744">• Pipeline and revenue</text>

  <rect x="56" y="1140" width="968" height="150" rx="28" fill="#101b3a"/>
  <text x="84" y="1190" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#ffffff">SEO cannot create demand in isolation.</text>
  <text x="84" y="1238" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#dfe5ff">Create demand elsewhere. Capture it with search.</text>
</svg>