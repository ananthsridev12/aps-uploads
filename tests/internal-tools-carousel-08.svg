nt-size="21" font-weight="400" fill="#626B7B" text-anchor="start" ><tspan x="132" dy="0">Ownership, dependencies, audit trails</tspan></text> <text x="970" y="747" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#2864D8" text-anchor="end" ><tspan x="970" dy="0">↗</tspan></text><rect x="72" y="813" width="936" height="100" rx="18" fill="#FFFCF5" stroke="#D8D2C5" stroke-width="2" /> <rect x="94" y="836" width="12" height="54" rx="6" fill="#2864D8" stroke="none" stroke-width="0" /> <text x="132" y="854" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#101B35" text-anchor="start" ><tspan x="132" dy="0">Identity &amp; security</tspan></text> <text x="132" y="892" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#626B7B" text-anchor="start" ><tspan x="132" dy="0">Access control, policies, recovery</tspan></text> <text x="970" y="873" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#2864D8" text-anchor="end" ><tspan x="970" dy="0">↗</tspan></text><rect x="72" y="939" width="936" height="100" rx="18" fill="#FFFCF5" stroke="#D8D2C5" stroke-width="2" /> <rect x="94" y="962" width="12" height="54" rx="6" fill="#2864D8" stroke="none" stroke-width="0" /> <text x="132" y="980" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#101B35" text-anchor="start" ><tspan x="132" dy="0">Analytics infrastructure</tspan></text> <text x="132" y="1018" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#626B7B" text-anchor="start" ><tspan x="132" dy="0">Connectors, refreshes, governance</tspan></text> <text x="970" y="999" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#2864D8" text-anchor="end" ><tspan x="970" dy="0">↗</tspan></text>
