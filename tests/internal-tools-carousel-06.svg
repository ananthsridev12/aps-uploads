 fill="#101B35" text-anchor="middle" ><tspan x="650" dy="0">Edge cases</tspan></text> <text x="650" y="718" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#626B7B" text-anchor="middle" ><tspan x="650" dy="0">Data, roles,</tspan><tspan x="650" dy="27">exceptions</tspan></text><circle cx="900" cy="560" r="19" fill="#101B35" stroke="none" stroke-width="0"/> <text x="900" y="510" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#626B7B" text-anchor="middle" ><tspan x="900" dy="0">YEAR 2</tspan></text> <rect x="800" y="620" width="200" height="185" rx="18" fill="#FFFCF5" stroke="#D8D2C5" stroke-width="2" /> <text x="900" y="670" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#101B35" text-anchor="middle" ><tspan x="900" dy="0">Ownership</tspan></text> <text x="900" y="718" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#626B7B" text-anchor="middle" ><tspan x="900" dy="0">Upgrades,</tspan><tspan x="900" dy="27">handover</tspan></text>
  <text x="76" y="890" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#101B35" text-anchor="start" ><tspan x="76" dy="0">Production-ready means planning for:</tspan></text>
