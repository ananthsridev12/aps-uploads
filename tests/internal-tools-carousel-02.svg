  <g opacity=".35" fill="#D8D2C5"><circle cx="40" cy="150" r="1.5"/><circle cx="138" cy="150" r="1.5"/><circle cx="236" cy="150" r="1.5"/><circle cx="334" cy="150" r="1.5"/><circle cx="432" cy="150" r="1.5"/><circle cx="530" cy="150" r="1.5"/><circle cx="628" cy="150" r="1.5"/><circle cx="726" cy="150" r="1.5"/><circle cx="824" cy="150" r="1.5"/><circle cx="922" cy="150" r="1.5"/><circle cx="1020" cy="150" r="1.5"/><circle cx="40" cy="420" r="1.5"/><circle cx="138" cy="420" r="1.5"/><circle cx="236" cy="420" r="1.5"/><circle cx="334" cy="420" r="1.5"/><circle cx="432" cy="420" r="1.5"/><circle cx="530" cy="420" r="1.5"/><circle cx="628" cy="420" r="1.5"/><circle cx="726" cy="420" r="1.5"/><circle cx="824" cy="420" r="1.5"/><circle cx="922" cy="420" r="1.5"/><circle cx="1020" cy="420" r="1.5"/><circle cx="40" cy="690" r="1.5"/><circle cx="138" cy="690" r="1.5"/><circle cx="236" cy="690" r="1.5"/><circle cx="334" cy="690" r="1.5"/><circle cx="432" cy="690" r="1.5"/><circle cx="530" cy="690" r="1.5"/><circle cx="628" cy="690" r="1.5"/><circle cx="726" cy="690" r="1.5"/><circle cx="824" cy="690" r="1.5"/><circle cx="922" cy="690" r="1.5"/><circle cx="1020" cy="690" r="1.5"/><circle cx="40" cy="960" r="1.5"/><circle cx="138" cy="960" r="1.5"/><circle cx="236" cy="960" r="1.5"/><circle cx="334" cy="960" r="1.5"/><circle cx="432" cy="960" r="1.5"/><circle cx="530" cy="960" r="1.5"/><circle cx="628" cy="960" r="1.5"/><circle cx="726" cy="960" r="1.5"/><circle cx="824" cy="960" r="1.5"/><circle cx="922" cy="960" r="1.5"/><circle cx="1020" cy="960" r="1.5"/></g>
  <text x="72" y="76" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#101B35" text-anchor="start" letter-spacing="4"><tspan x="72" dy="0">MARTECH IN PRACTICE</tspan></text>
  <rect x="72" y="99" width="70" height="7" rx="3" fill="#F6C945" stroke="none" stroke-width="0" />
  <text x="1008" y="76" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#101B35" text-anchor="end" ><tspan x="1008" dy="0">02 / 10</tspan></text>
  
  <text x="72" y="220" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="800" fill="#101B35" text-anchor="start" ><tspan x="72" dy="0">The temptation</tspan><tspan x="72" dy="72">is obvious.</tspan></text>
  <rect x="72" y="410" width="936" height="250" rx="18" fill="#F8E8A9" stroke="#D7C17A" stroke-width="2" transform="rotate(-1 540 535)"/>
  <rect x="452" y="390" width="176" height="24" rx="3" fill="#E6D7A8" stroke="none" stroke-width="0" transform="rotate(-1 540 402)"/>
  <text x="118" y="500" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#101B35" text-anchor="start" ><tspan x="118" dy="0">“We can build that</tspan></text>
  <text x="118" y="562" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#101B35" text-anchor="start" ><tspan x="118" dy="0">ourselves.”</tspan></text>
  <text x="76" y="735" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#101B35" text-anchor="start" ><tspan x="76" dy="0">Licence fees look expensive.</tspan></text>
  <text x="76" y="788" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#101B35" text-anchor="start" ><tspan x="76" dy="0">A prototype looks quick.</tspan></text>
  <text x="76" y="841" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#101B35" text-anchor="start" ><tspan x="76" dy="0">The build estimate looks manageable.</tspan></text>
  <rect x="72" y="920" width="936" height="228" rx="22" fill="#FFFCF5" stroke="#D8D2C5" stroke-width="2" />
  <text x="108" y="978" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#626B7B" text-anchor="start" ><tspan x="108" dy="0">But the estimate usually counts</tspan></text>
  <text x="108" y="1020" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#101B35" text-anchor="start" ><tspan x="108" dy="0">the first version, not the next five years.</tspan></text>
  <line x1="108" y1="1060" x2="280" y2="1060" stroke="#F6C945" stroke-width="8"  stroke-linecap="round"/>
  <text x="108" y="1100" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#626B7B" text-anchor="start" ><tspan x="108" dy="0">A working demo is a beginning, not a business case.</tspan></text>
  <circle cx="922" cy="250" r="42" fill="#F6C945" stroke="none" stroke-width="0"/>
  <text x="922" y="261" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" fill="#101B35" text-anchor="middle" ><tspan x="922" dy="0">01</tspan></text>

  <line x1="72" y1="1260" x2="1008" y2="1260" stroke="#D8D2C5" stroke-width="2"  stroke-linecap="round"/>
  <text x="72" y="1302" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#626B7B" text-anchor="start" letter-spacing="1"><tspan x="72" dy="0">ANANTH SRIDEV  •  MARKETING TECHNOLOGY</tspan></text>
  <text x="1008" y="1302" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#101B35" text-anchor="end" letter-spacing="1"><tspan x="1008" dy="0">BUILD  /  BUY  /  INTEGRATE</tspan></text>
  </svg>