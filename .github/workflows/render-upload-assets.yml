name: Render upload assets

on:
  push:
    paths:
      - "tests/*.svg"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Render SVG assets to PNG
        run: |
          shopt -s nullglob
          for f in tests/*.svg; do
            out="${f%.svg}.png"
            convert -background none -density 144 "$f" "$out"
          done

      - name: Commit rendered files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/*.png
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Render upload assets to PNG"
          git push
